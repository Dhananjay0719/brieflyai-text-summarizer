<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Text Summarizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="jumbotron text-center">
        <h1 class="display-5 fw-bold mainhead">BrieflyAI - Text Summarizer</h1>
        <p class="lead mainhead">
            Industrial AI-powered text summarization platform
        </p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form action="/analyze" method="POST">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Enter Text</label>
                    <textarea name="rawtext" class="form-control" rows="8"
                              placeholder="Paste article or document here..." required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Summarization Mode</label>
                    <select name="mode" class="form-select">
                        <option value="extractive">⚡ Fast — Extractive</option>
                        <option value="abstractive">🧠 Smart — AI (Transformer)</option>
                    </select>
                </div>

                <!-- Loading Spinner -->
                <div id="loading" class="text-center my-3 d-none">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">Generating summary…</p>
                </div>

                <div class="d-grid">
                   <button type="submit" class="btn btn-primary btn-lg" onclick="showLoader()">
                        Generate Summary
                    </button>
                </div>

            </form>
        </div>
    </div>

</div>
<script>
function showLoader() {
    document.getElementById("loading").classList.remove("d-none");
}
</script>
</body>
</html>
