<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrieflyAI — Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="text-center mb-4">
        <h1 class="display-6 fw-bold">BrieflyAI — Summary</h1>
        <span class="badge bg-info text-dark text-uppercase">{{ mode }}</span>
    </div>

    <div class="row g-4">

        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-secondary text-white">Original Text</div>
                <div class="card-body">
                    <p class="originalTxt">{{ og }}</p>
                </div>
                <div class="card-footer">Words: {{ len_og }}</div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm h-100 border-primary">
                <div class="card-header bg-primary text-white">Summary</div>
                <div class="card-body">
                    <p class="summaryTxt">{{ summary }}</p>
                </div>
                <div class="card-footer">Words: {{ len_summary }}</div>
            </div>
        </div>

    </div>

    <div class="text-center mt-4">
        <a href="/" class="btn btn-outline-secondary">⬅ Summarize Another</a>
    </div>

</div>
</body>
</html>
